---
layout: default
title: Categories
---

<h2>Categories</h2>

<p>All posts grouped by category.</p>

{% for category in site.categories %}
<h3 id="{{ category[0] | slugify }}">{{ category[0] }} ({{ category[1] | size }})</h3>
<ul class="post-list">
    {% for post in category[1] %}
    <li>
        <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span> &ndash;
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
</ul>
{% endfor %}
