---
layout: default
---

<h2>{{ page.title }}</h2>

<p class="post-meta">
    <span class="post-date">{{ page.date | date: "%Y-%m-%d" }}</span>
    {% if page.categories.size > 0 %}
    &middot; Filed under:
    {% for cat in page.categories %}<a href="{{ '/categories' | relative_url }}#{{ cat | slugify }}">{{ cat }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}
    {% endif %}
</p>

{{ content }}

<p>&larr; <a href="{{ '/' | relative_url }}">Back to home</a></p>
